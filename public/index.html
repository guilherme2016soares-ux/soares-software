<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>SOARES SOFTWARE</title><style>
:root{--cor:#f97316;--cor2:#f59e0b;--azul:#2563eb;--fundo:#f1f5f9;--card:#fff;--texto:#0f172a;--cinza:#64748b;--borda:#e2e8f0;--verde:#16a34a}
*{margin:0;padding:0;box-sizing:border-box}html{font-size:18px}
body{font-family:system-ui,sans-serif;background:var(--fundo);color:var(--texto);display:flex;min-height:100vh}
button,label,h1,h2,h3,.sub,.badge,.rot,.total,.itot,.sel-info,.aviso,.vazio,.chips button,.desc,.toast{text-transform:uppercase}input,textarea{text-transform:uppercase}input::placeholder,textarea::placeholder{text-transform:uppercase}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--borda);border-radius:10px;font-size:15px;background:#fff;color:var(--texto)}
.sidebar{width:230px;background:#fff;border-right:1px solid var(--borda);padding:16px 10px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:60}
.sidebar .brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;padding:6px 10px 16px}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:#334155;font-size:14px;font-weight:700;text-decoration:none;margin-bottom:3px;cursor:pointer}
.sidebar nav a .ic{width:22px;text-align:center}.sidebar nav a.ativo{background:linear-gradient(90deg,var(--cor),var(--cor2));color:#fff;box-shadow:0 4px 12px rgba(249,115,22,.3)}
.sidebar .sair{margin-top:16px}
.main{flex:1;margin-left:230px;min-height:100vh}
.header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--borda);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.header .busca{display:flex;align-items:center;gap:8px;background:#f1f5f9;border:1px solid var(--borda);border-radius:12px;padding:8px 14px;flex:1;max-width:340px}
.header .busca input{border:none;background:transparent;padding:0;font-size:14px}.header .busca input:focus{outline:none}
.header .hbtn{width:44px;height:44px;border:none;border-radius:12px;background:#f1f5f9;font-size:18px;cursor:pointer}
.content{max-width:1100px;margin:0 auto;padding:20px}
.view{display:none}.view.ativa{display:block}
.card{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.card h3{font-size:15px}
.linha{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.sub{color:var(--cinza);font-size:13px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800}
.b-admin{background:#fff7ed;color:#c2410c}.b-atendente{background:#eff6ff;color:#1d4ed8}.b-entregador{background:#ecfdf5;color:#047857}.b-pendente{background:#fee2e2;color:#b91c1c}.b-parcial{background:#fef3c7;color:#b45309}.b-entregue{background:#dcfce7;color:#15803d}.b-pagpend{background:#fef2f2;color:#b91c1c}
.btn{border:none;border-radius:12px;padding:13px 14px;font-size:14px;font-weight:800;cursor:pointer;min-height:48px}
.btn-cor{background:linear-gradient(90deg,var(--cor),var(--cor2));color:#fff}.btn-azul{background:var(--azul);color:#fff}.btn-claro{background:#e2e8f0;color:#0f172a}.btn-verde{background:var(--verde);color:#fff}.btn-voz{background:#7c3aed;color:#fff}
.btn-x{background:transparent;border:none;color:var(--cinza);font-size:20px;cursor:pointer}.btn-pag{border:2px solid var(--borda);background:#fff;color:var(--texto);font-size:13px}.btn-pag.ativo{border-color:var(--cor);background:var(--cor);color:#fff}
.sel-info{font-size:13px;font-weight:800;color:var(--verde);margin-top:8px;padding:8px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;display:none}.sel-info.visivel{display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{border:1px solid var(--borda);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}.chips button.ativo{background:var(--cor);border-color:var(--cor);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer}.kpi .kic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px}.kpi .knum{font-size:24px;font-weight:900;white-space:nowrap}.kpi .krot{font-size:12px;color:var(--cinza);font-weight:700}.kpi .kdelta{font-size:12px;font-weight:800;margin-top:6px}
.dash2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.dash2{grid-template-columns:1fr}}
.chart{height:180px;display:flex;align-items:flex-end;gap:8px;padding-top:10px}.chart .bar{flex:1;background:linear-gradient(180deg,var(--cor),var(--cor2));border-radius:8px 8px 0 0;min-height:10px;position:relative}.chart .bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--cinza)}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--borda)}.list-item:last-child{border-bottom:none}.list-item .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}.list-item .txt{flex:1;font-size:14px}.list-item .tm{font-size:12px;color:var(--cinza)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-end;justify-content:center;z-index:100}.modal-bg.aberta{display:flex}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:18px 14px 24px}@media(min-width:640px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:18px}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.modal-head h2{font-size:17px;margin:0}.modal-head .btn-x{width:42px;height:42px;border-radius:12px;background:#fee2e2;color:#b91c1c;font-size:19px}
label{display:block;font-size:12px;font-weight:800;color:#334155;margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item-row{border:1px solid var(--borda);border-radius:12px;padding:8px;margin-bottom:8px;background:#fafafa}
.item-r1{display:grid;grid-template-columns:54px 92px 1fr 40px 30px;gap:6px;align-items:center}.item-r2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.item-row input,.item-row select{padding:8px;font-size:14px}.item-row .itot{width:100%;padding:8px;border:1px solid var(--cor);border-radius:10px;font-size:14px;background:#fff7ed;color:var(--cor);font-weight:800;text-align:right}
.prod-sug{display:flex;flex-direction:column;gap:4px;margin-top:6px}.prod-sug-item{background:#fff;border:1px solid var(--cor);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--texto);text-align:left}.prod-sug-item:hover{background:#fff7ed}
.total{font-size:16px;font-weight:800;color:var(--cor);text-align:right;margin-top:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;z-index:200;display:none;max-width:90%;text-align:center}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.acoes .btn{flex:1;min-width:110px}
.estat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:12px}.estat .card{text-align:center;margin:0;padding:14px 8px}.estat .num{font-size:20px;font-weight:900;white-space:nowrap}
.vazio{text-align:center;color:var(--cinza);padding:24px 8px;font-size:14px}
.item-ent{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--borda)}.item-ent .desc{flex:1;font-size:14px}.item-ent input{width:74px;flex:0 0 auto}
.pag-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--borda);font-size:12px;flex-wrap:wrap}.pag-item .val{font-weight:800;color:#15803d}
.campo-voz{display:flex;gap:6px;align-items:center}.campo-voz>input,.campo-voz>textarea{flex:1}
.btn-mic{flex:0 0 auto;width:48px;height:48px;border:none;border-radius:12px;background:#7c3aed;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-busca{flex:0 0 auto;width:48px;height:48px;border:none;border-radius:12px;background:var(--azul);color:#fff;font-size:20px;cursor:pointer}
.sug{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--borda);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.sug .foto{width:44px;height:44px;border-radius:50%;background:var(--cor);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex:0 0 auto}
.sug .info{flex:1}.sug .info .n{font-size:15px;font-weight:800}.sug .info .d{font-size:12px;color:var(--cinza)}.sug .seta{font-size:22px;color:var(--cinza)}
.aviso{background:#fef3c7;border:1px solid #fde68a;border-radius:12px;padding:10px 12px;font-size:13px;color:#92400e;margin-bottom:12px}
.calc-display{background:#f1f5f9;border:1px solid var(--borda);border-radius:12px;padding:12px;font-size:26px;font-weight:900;text-align:right;margin-bottom:10px;overflow:hidden}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.calc-grid button{min-height:52px;font-size:18px;font-weight:800;border:none;border-radius:12px;background:#e2e8f0;color:#0f172a;cursor:pointer}.calc-grid button.op{background:var(--cor);color:#fff}.calc-grid button.ig{background:var(--azul);color:#fff}
.login-box{max-width:400px;margin:60px auto;background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:26px 20px}
#printArea{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:16px;font-size:13px;color:#000}#printArea table{width:100%;border-collapse:collapse}#printArea th,#printArea td{border:1px solid #000;padding:5px;font-size:12px}}
@media(max-width:820px){.sidebar{width:64px}.sidebar .brand span,.sidebar nav a .lbl{display:none}.sidebar nav a{justify-content:center}.main{margin-left:64px}}
@media(max-width:820px){input,select,textarea{font-size:16px !important}}
</style></head><body>
<aside class="sidebar" id="sidebar" style="display:none"><div class="brand"><span style="font-size:22px">🟠</span><span>SOARES SOFTWARE</span></div><nav id="nav"></nav><button class="btn btn-claro sair" style="width:100%" onclick="sair()">SAIR</button></aside>
<div class="main"><header class="header"><div class="busca"><span>🔍</span><input type="text" placeholder="PESQUISAR"></div><div style="display:flex;gap:8px;align-items:center"><button class="hbtn" onclick="toast('SEM NOVAS NOTIFICAÇÕES')">🔔</button><button class="btn btn-cor" onclick="novoPedido()">+ PEDIDO</button></div></header><div class="content">
<div id="view-login" class="view ativa"><div class="login-box"><div style="text-align:center"><div style="font-size:44px">🟠</div><h2 style="margin:6px 0">SOARES SOFTWARE</h2><div class="sub">ENTRE COM SEU USUÁRIO E SENHA</div></div><label>USUÁRIO</label><div class="campo-voz"><input type="text" id="loginUsuario" placeholder="SEU NOME" onkeydown="if(event.key==='Enter')fazerLogin()"><button class="btn-mic" onclick="vozCampo('loginUsuario')">🎤</button></div><label>SENHA</label><div class="campo-voz"><input type="password" id="loginSenha" inputmode="numeric" placeholder="SUA SENHA" onkeydown="if(event.key==='Enter')fazerLogin()"><button class="btn-mic" onclick="vozSenha('loginSenha')">🎤</button></div><button class="btn btn-cor" style="width:100%;margin-top:14px" onclick="fazerLogin()">ENTRAR</button></div></div>
<div id="view-inicio" class="view"></div>
<div id="view-pedidos" class="view"><div class="toolbar"><input type="date" id="filtroDe" onchange="filtroDataDe=this.value;renderPedidos()"><span class="sub">ATÉ</span><input type="date" id="filtroAte" onchange="filtroDataAte=this.value;renderPedidos()"><button class="btn btn-claro" style="flex:0;min-height:42px;padding:7px 10px;font-size:12px" onclick="$('filtroDe').value='';$('filtroAte').value='';filtroDataDe='';filtroDataAte='';renderPedidos()">LIMPAR</button><button class="btn btn-azul" style="flex:0;min-height:42px;padding:7px 10px;font-size:12px" onclick="var h=new Date();var d=h.getFullYear()+'-'+String(h.getMonth()+1).padStart(2,'0')+'-'+String(h.getDate()).padStart(2,'0');$('filtroDe').value=d;$('filtroAte').value=d;filtroDataDe=d;filtroDataAte=d;renderPedidos()">HOJE</button></div><div id="res-pedidos"></div></div>
<div id="view-clientes" class="view"><div class="toolbar"><div class="campo-voz" style="flex:1"><input type="text" id="buscaCliInput" placeholder="BUSCAR CLIENTE..." oninput="buscaCli=this.value;renderClientes()"><button class="btn-mic" onclick="vozBusca('buscaCliInput',v=>buscaCli=v,renderClientes)">🎤</button></div><button class="btn btn-cor" onclick="novoCliente()">+ CLIENTE</button></div><div id="res-clientes"></div></div>
<div id="view-produtos" class="view"></div>
<div id="view-contas" class="view"><div class="toolbar"><div class="campo-voz" style="flex:1"><input type="text" id="buscaContaInput" placeholder="DIGITE OU FALE O NOME DO CLIENTE..." oninput="buscaConta=this.value;renderContas()"><button class="btn-mic" onclick="vozBusca('buscaContaInput',v=>buscaConta=v,renderContas)">🎤</button></div></div><div id="res-contas"></div></div>
<div id="view-financeiro" class="view"></div>
<div id="view-entregas" class="view"></div>
<div id="view-historico" class="view"><div class="toolbar"><div class="campo-voz" style="flex:1"><input type="text" id="buscaHistInput" placeholder="BUSCAR CLIENTE..." oninput="histCli=this.value;renderHistorico()"><button class="btn-mic" onclick="vozBusca('buscaHistInput',v=>histCli=v,renderHistorico)">🎤</button></div></div><div class="toolbar"><input type="date" id="histDe" onchange="histDataDe=this.value;renderHistorico()"><span class="sub">ATÉ</span><input type="date" id="histAte" onchange="histDataAte=this.value;renderHistorico()"><button class="btn btn-claro" style="flex:0;min-height:42px;padding:7px 10px;font-size:12px" onclick="$('histDe').value='';$('histAte').value='';histDataDe='';histDataAte='';renderHistorico()">LIMPAR</button></div><div id="res-historico"></div></div>
<div id="view-usuarios" class="view"></div>
<div id="view-config" class="view"></div>
</div></div>
<div id="toast" class="toast"></div><div id="printArea"></div>
<div class="modal-bg" id="mPedido"><div class="modal"><div class="modal-head"><h2 id="mpTitulo">NOVO PEDIDO</h2><button class="btn-x" onclick="fechar('mPedido')">✕</button></div><label>QUEM É O CLIENTE?</label><div class="campo-voz"><input type="text" id="pedClienteInput" placeholder="DIGITE OU FALE O NOME..." oninput="buscarClienteSug()" onkeydown="if(event.key==='Enter'){event.preventDefault();selecionarPrimeiroSug()}" autocomplete="off"><button class="btn-mic" onclick="vozCampo('pedClienteInput')">🎤</button></div><div id="pedClienteSug"></div><button class="btn btn-claro" style="width:100%;margin-top:6px" onclick="novoCliente()">➕ NOVO CLIENTE</button><label>O QUE ELE PEDIU?</label><div id="pedItens"></div><div class="toolbar" style="margin-top:6px"><button class="btn btn-claro" onclick="addItemRow()">➕ MANUAL</button><button class="btn btn-claro" onclick="abrir('mCalc')">🧮 CALCULADORA</button></div><div class="total">TOTAL: <span id="pedTotal">R$ 0,00</span></div><label>OBSERVAÇÕES</label><div class="campo-voz"><textarea id="pedObs" placeholder="EX.: ENTREGAR NO PORTÃO..."></textarea><button class="btn-mic" onclick="vozCampo('pedObs')">🎤</button></div><div class="acoes"><button class="btn btn-claro" onclick="fechar('mPedido')">CANCELAR</button><button class="btn btn-cor" onclick="salvarPedido()">💾 SALVAR PEDIDO</button></div></div></div>
<div class="modal-bg" id="mPagarNovo"><div class="modal"><div class="modal-head"><h2>COMO VAI PAGAR?</h2><button class="btn-x" onclick="fechar('mPagarNovo')">✕</button></div><div class="grid2" id="pgEscolha"><button class="btn btn-cor" style="font-size:15px" onclick="escolherPagAgora()">💵 PAGAR AGORA</button><button class="btn btn-azul" style="font-size:15px" onclick="efetivarPedido('prazo')">📋 FICAR DEVENDO</button></div><div id="pgMeios" style="display:none"><label>FORMA DE PAGAMENTO</label><select id="npForma" onchange="setForma(this.value,'np')"><option value="pix">💠 PIX</option><option value="cartao">💳 CARTÃO</option><option value="dinheiro">💵 DINHEIRO</option><option value="transferencia">🏦 TRANSFERÊNCIA</option></select><div class="sel-info" id="npSelecionada"></div><div class="acoes"><button class="btn btn-claro" onclick="voltarEscolha()">↩️ VOLTAR</button><button class="btn btn-cor" onclick="efetivarPedido('avista')">💾 CONFIRMAR</button></div></div></div></div>
<div class="modal-bg" id="mCliente"><div class="modal"><div class="modal-head"><h2 id="mcTitulo">NOVO CLIENTE</h2><button class="btn-x" onclick="fechar('mCliente')">✕</button></div><label>NOME *</label><div class="campo-voz"><input type="text" id="cNome" placeholder="NOME COMPLETO"><button class="btn-mic" onclick="vozCampo('cNome')">🎤</button></div><div class="grid2"><div><label>TELEFONE</label><div class="campo-voz"><input type="text" id="cTel" placeholder="(11) 99999-9999"><button class="btn-mic" onclick="vozCampo('cTel')">🎤</button></div></div><div><label>BAIRRO</label><div class="campo-voz"><input type="text" id="cBairro" placeholder="CENTRO"><button class="btn-mic" onclick="vozCampo('cBairro')">🎤</button></div></div></div><label>ENDEREÇO</label><div class="campo-voz"><input type="text" id="cEnd" placeholder="RUA, NÚMERO"><button class="btn-mic" onclick="vozCampo('cEnd')">🎤</button></div><label>OBSERVAÇÕES</label><div class="campo-voz"><textarea id="cObs" placeholder="ANOTAÇÕES..."></textarea><button class="btn-mic" onclick="vozCampo('cObs')">🎤</button></div><div class="acoes"><button class="btn btn-claro" onclick="fechar('mCliente')">CANCELAR</button><button class="btn btn-cor" onclick="salvarCliente()">💾 SALVAR CLIENTE</button></div></div></div>
<div class="modal-bg" id="mProduto"><div class="modal"><div class="modal-head"><h2 id="mpTitulo">NOVO PRODUTO</h2><button class="btn-x" onclick="fechar('mProduto')">✕</button></div><label>NOME DO PRODUTO *</label><div class="campo-voz"><input type="text" id="pNome" placeholder="EX.: AREIA, TIJOLO"><button class="btn-mic" onclick="vozCampo('pNome')">🎤</button></div><div class="aviso">CADASTRE ATÉ 3 FORMAS DE VENDER O MESMO PRODUTO, CADA UMA COM SUA UNIDADE E PREÇO.</div><label>FORMA 1 DE VENDA</label><div class="grid2"><div><label>UNIDADE</label><select id="pUn1"><option value="un">UNIDADE</option><option value="metro">METRO</option><option value="milheiro">MILHEIRO</option><option value="saco">SACO</option><option value="carrada">CARRADA</option><option value="vara">VARA</option></select></div><div><label>PREÇO (R$)</label><input type="number" id="pPreco1" step="0.01" placeholder="0,00"></div></div><label>FORMA 2 DE VENDA (OPCIONAL)</label><div class="grid2"><div><label>UNIDADE</label><select id="pUn2"><option value="">— NÃO USAR —</option><option value="un">UNIDADE</option><option value="metro">METRO</option><option value="milheiro">MILHEIRO</option><option value="saco">SACO</option><option value="carrada">CARRADA</option><option value="vara">VARA</option></select></div><div><label>PREÇO (R$)</label><input type="number" id="pPreco2" step="0.01" placeholder="0,00"></div></div><label>FORMA 3 DE VENDA (OPCIONAL)</label><div class="grid2"><div><label>UNIDADE</label><select id="pUn3"><option value="">— NÃO USAR —</option><option value="un">UNIDADE</option><option value="metro">METRO</option><option value="milheiro">MILHEIRO</option><option value="saco">SACO</option><option value="carrada">CARRADA</option><option value="vara">VARA</option></select></div><div><label>PREÇO (R$)</label><input type="number" id="pPreco3" step="0.01" placeholder="0,00"></div></div><label>QUANTOS DA FORMA 2 CABEM NA FORMA 1? (OPCIONAL)</label><input type="text" id="pConv" placeholder="EX.: 1 CARRADA = 13 METROS"><div class="acoes"><button class="btn btn-claro" onclick="fechar('mProduto')">CANCELAR</button><button class="btn btn-cor" onclick="salvarProduto()">💾 SALVAR PRODUTO</button></div></div></div>

<div class="modal-bg" id="mPagamento" style="z-index:120"><div class="modal"><div class="modal-head"><h2>RECEBER PAGAMENTO</h2><button class="btn-x" onclick="fechar('mPagamento')">✕</button></div><div id="pgInfo" class="sub" style="margin-bottom:8px"></div><label>QUANTO ESTÁ PAGANDO? (R$)</label><input type="number" id="pgValor" step="0.01" placeholder="0,00"><label>COMO ESTÁ PAGANDO?</label><select id="pgForma" onchange="setForma(this.value,'pg')"><option value="pix">💠 PIX</option><option value="cartao">💳 CARTÃO</option><option value="dinheiro">💵 DINHEIRO</option><option value="transferencia">🏦 TRANSFERÊNCIA</option></select><div class="sel-info" id="pgSelecionada"></div><div class="acoes"><button class="btn btn-claro" onclick="fechar('mPagamento')">CANCELAR</button><button class="btn btn-cor" onclick="confirmarPagamento()">💾 CONFIRMAR</button></div></div></div>
<div class="modal-bg" id="mCalc"><div class="modal"><div class="modal-head"><h2>CALCULADORA</h2><button class="btn-x" onclick="fechar('mCalc')">✕</button></div><div class="calc-display" id="calcDisp">0</div><div class="calc-grid"><button onclick="calcDig('7')">7</button><button onclick="calcDig('8')">8</button><button onclick="calcDig('9')">9</button><button class="op" onclick="calcOp('÷')">÷</button><button onclick="calcDig('4')">4</button><button onclick="calcDig('5')">5</button><button onclick="calcDig('6')">6</button><button class="op" onclick="calcOp('×')">×</button><button onclick="calcDig('1')">1</button><button onclick="calcDig('2')">2</button><button onclick="calcDig('3')">3</button><button class="op" onclick="calcOp('-')">−</button><button onclick="calcDig('0')">0</button><button onclick="calcDig(',')">,</button><button class="ig" onclick="calcIgual()">=</button><button class="op" onclick="calcOp('+')">+</button><button class="ig" style="grid-column:span 2" onclick="calcLimpar()">C</button><button class="op" style="grid-column:span 2" onclick="calcApagar()">⌫</button></div><div class="acoes"><button class="btn btn-claro" onclick="fechar('mCalc')">FECHAR</button><button class="btn btn-cor" onclick="usarCalculadora()">💾 USAR NO PREÇO</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
const DB='sisentrega_v1',MASTER={nome:'GUILHERME SOARES',senha:'951223',perfil:'admin',master:true};
let S={clientes:[],pedidos:[],usuarios:[],produtos:[]},gsUrl=localStorage.getItem('gs_url')||'',usuarioLogado=null,entregador=localStorage.getItem('entregador')||'';
let filtroPed='todos',buscaPed='',filtroDataDe='',filtroDataAte='',filtroEnt='pendente',buscaCli='',buscaConta='',histCli='',histDataDe='',histDataAte='';
let pedEditId=null,pedClienteId='',clienteEditId=null,produtoEditId=null,entregaPedId=null,usuarioEditId=null,pagPedidoId=null,pedDados=null;
let perfilSel='atendente',formaSel='pix',navHist=[],campoPrecoAtivo=null,calcExprStr='0',seqItens=0;
const TABS=[['inicio','🏠','INÍCIO'],['pedidos','📋','PEDIDOS'],['clientes','👥','CLIENTES'],['produtos','📦','PRODUTOS'],['contas','💰','CONTAS'],['financeiro','📊','FINANCEIRO'],['entregas','🚚','ENTREGAS'],['historico','📜','HISTÓRICO'],['usuarios','🛡️','USUÁRIOS'],['config','⚙️','AJUSTES']];
const PERFIS={admin:['👑 ADMINISTRADOR','b-admin'],atendente:['🛒 ATENDENTE','b-atendente'],entregador:['🚚 ENTREGADOR','b-entregador']};
const FORMAS={pix:['💠 PIX'],cartao:['💳 CARTÃO'],dinheiro:['💵 DINHEIRO'],transferencia:['🏦 TRANSFERÊNCIA']};
const UNIDADES=['un','metro','milheiro','saco','carrada','vara'];
const ST={pendente:['ENTREGA PENDENTE','b-pendente'],parcial:['ENTREGA PARCIAL','b-parcial'],entregue:['ENTREGUE','b-entregue']};
function $(id){return document.getElementById(id)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function din(v){return 'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dt(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function norm(s){return (s||'').toString().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}
function formaLabel(f){return FORMAS[f]?FORMAS[f][0]:''}
function unLabel(u){return u==='metro'?'METRO':u==='milheiro'?'MILHEIRO':u==='saco'?'SACO':u==='carrada'?'CARRADA':u==='vara'?'VARA':'UNIDADE'}
function itemTxt(i){return i.qtd+' '+(i.unidade&&i.unidade!=='un'?unLabel(i.unidade):'UNIDADE')+' '+i.descricao}
function diaLocal(iso){const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function naData(p,de,ate){const dia=diaLocal(p.criadoEm);if(de&&dia<de)return false;if(ate&&dia>ate)return false;return true}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',2600)}
function cliente(id){return S.clientes.find(c=>c.id===id)}
function produto(id){return S.produtos.find(p=>p.id===id)}
function totalPedido(p){return p.itens.reduce((a,i)=>a+(+i.qtd||0)*(+i.preco||0),0)}
function statusPedido(p){const t=p.itens.reduce((a,i)=>a+(+i.qtd||0),0),e=p.itens.reduce((a,i)=>a+(+(i.entregue||0)),0);if(e<=0)return'pendente';return e>=t?'entregue':'parcial'}
function ehPrazo(p){return (p.pagamento||(p.pago?'prazo':'avista'))==='prazo'}
function totalPagoPedido(p){const pgs=p.pagamentos||[];if(pgs.length)return pgs.reduce((a,pg)=>a+(+pg.valor||0),0);return p.pago?totalPedido(p):0}
function saldoPedido(p){return Math.max(0,totalPedido(p)-totalPagoPedido(p))}
function badgePagamento(p){return ehPrazo(p)?(saldoPedido(p)>0?'<span class="badge b-pagpend">A PAGAR</span>':'<span class="badge b-entregue">PAGO</span>'):''}
function valoresConta(cid){const ped=S.pedidos.filter(p=>p.clienteId===cid),prazo=ped.filter(ehPrazo);return{aReceber:prazo.reduce((a,p)=>a+saldoPedido(p),0),recebido:prazo.reduce((a,p)=>a+totalPagoPedido(p),0)}}
function perfilAtivo(){return usuarioLogado?usuarioLogado.perfil:null}
function podeExcluir(){return perfilAtivo()==='admin'}
function abasPermitidas(){const p=perfilAtivo();if(p==='admin')return TABS;if(p==='atendente')return TABS.filter(t=>t[0]!=='config'&&t[0]!=='usuarios');if(p==='entregador')return[TABS[0],TABS.filter(t=>t[0]==='entregas')[0]];return[]}
function palavraDigito(w){const m={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9};return m[w]!==undefined?m[w]:null}
function fazerLogin(){const nome=$('loginUsuario').value.trim(),senha=$('loginSenha').value.trim();if(!nome){toast('DIGITE OU FALE O SEU NOME');return}if(!senha){toast('DIGITE OU FALE A SUA SENHA');return}if(norm(nome)===norm(MASTER.nome)&&senha===MASTER.senha){usuarioLogado={id:'master',nome:MASTER.nome,perfil:'admin',master:true};posLogin();return}const u=S.usuarios.find(x=>x.nome&&norm(x.nome)===norm(nome));if(!u){toast('USUÁRIO NÃO ENCONTRADO');return}if((u.senha||'')!==senha){toast('SENHA INCORRETA');return}usuarioLogado={id:u.id,nome:u.nome,perfil:u.perfil||'atendente'};posLogin()}
function posLogin(){$('loginSenha').value='';$('sidebar').style.display='block';document.querySelectorAll('.view').forEach(v=>v.classList.remove('ativa'));renderNav();mostrarAba('inicio')}
function sair(){usuarioLogado=null;navHist=[];$('sidebar').style.display='none';document.querySelectorAll('.view').forEach(v=>v.classList.remove('ativa'));$('view-login').classList.add('ativa')}
function setPerfil(v){perfilSel=v;['admin','atendente','entregador'].forEach(f=>{const el=$('perf'+f.charAt(0).toUpperCase()+f.slice(1));if(el)el.classList.toggle('ativo',f===v)});$('perfInfo').textContent=v==='admin'?'PODE TUDO: VER TUDO, CADASTRAR USUÁRIOS E APAGAR DADOS.':v==='atendente'?'FAZ PEDIDOS, VÊ CLIENTES, PRODUTOS, CONTAS, FINANCEIRO E HISTÓRICO. NÃO APAGA NADA.':'VÊ SÓ AS ENTREGAS E DÁ BAIXA.'}
function setForma(v,prefix){formaSel=v;const sel=$(prefix+'Forma');if(sel)sel.value=v;const info=$(prefix+'Selecionada');if(info){info.textContent='✓ FORMA SELECIONADA: '+formaLabel(v);info.classList.add('visivel')}}
function load(){try{const r=localStorage.getItem(DB);S=r?JSON.parse(r):{clientes:[],pedidos:[],usuarios:[],produtos:[]};if(!S.usuarios)S.usuarios=[];if(!S.produtos)S.produtos=[]}catch(e){S={clientes:[],pedidos:[],usuarios:[],produtos:[]}}}
function saveLocal(){localStorage.setItem(DB,JSON.stringify(S))}
/* AJUSTE 1: SALVAR NO SERVIDOR (banco na nuvem) */
function salvar(){saveLocal();fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)}).then(r=>r.json()).then(res=>{if(res&&res.ok===false)console.log('ERRO AO SALVAR: '+(res.msg||''))}).catch(e=>console.log('SERVIDOR INDISPONÍVEL: '+e))}
/* AJUSTE 2: BUSCAR DO SERVIDOR */
async function syncPull(){try{const r=await fetch('/api/data'),d=await r.json();if(d&&Array.isArray(d.clientes)){S={clientes:d.clientes,pedidos:d.pedidos||[],usuarios:d.usuarios||[],produtos:d.produtos||[]};saveLocal();if(usuarioLogado){renderNav();renderAll()}toast('BANCO SINCRONIZADO')}}catch(e){toast('SEM CONEXÃO COM O SERVIDOR')}}
function abrir(id){$(id).classList.add('aberta')}
function fechar(id){$(id).classList.remove('aberta')}
function renderNav(){const n=$('nav'),abas=abasPermitidas();n.innerHTML=abas.map(t=>`<a id="tab-${t[0]}" onclick="trocarTab('${t[0]}')"><span class="ic">${t[1]}</span><span class="lbl">${t[2]}</span></a>`).join('')}
function mostrarAba(t){if(!usuarioLogado)return;if(!abasPermitidas().some(x=>x[0]===t))t='inicio';document.querySelectorAll('.view').forEach(v=>v.classList.remove('ativa'));$('view-'+t).classList.add('ativa');document.querySelectorAll('#nav a').forEach(b=>b.classList.remove('ativo'));const te=$('tab-'+t);if(te)te.classList.add('ativo');renderTab(t)}
function trocarTab(t){const at=document.querySelector('.view.ativa').id.replace('view-','');if(at&&at!==t&&navHist[navHist.length-1]!==at)navHist.push(at);mostrarAba(t)}
function renderTab(t){if(t==='inicio')renderInicio();if(t==='pedidos')renderPedidos();if(t==='clientes')renderClientes();if(t==='produtos')renderProdutos();if(t==='contas')renderContas();if(t==='financeiro')renderFinanceiro();if(t==='entregas')renderEntregas();if(t==='historico')renderHistorico();if(t==='usuarios')renderUsuarios();if(t==='config')renderConfig()}
function renderAll(){TABS.forEach(t=>renderTab(t[0]))}
function atrasados(){const out=[];S.clientes.forEach(c=>{const ped=S.pedidos.filter(p=>p.clienteId===c.id&&ehPrazo(p));const aReceber=ped.reduce((a,p)=>a+saldoPedido(p),0);if(aReceber<=0)return;let ult=null;ped.forEach(p=>(p.pagamentos||[]).forEach(pg=>{if(!ult||pg.data>ult)ult=pg.data}));const base=ult||ped.reduce((m,p)=>!m||p.criadoEm>m?p.criadoEm:m,'');if(!base)return;const dias=Math.floor((Date.now()-new Date(base).getTime())/86400000);if(dias>30)out.push({c,dias,aReceber})});return out}
function renderInicio(){if(!usuarioLogado)return;const u=usuarioLogado,p=PERFIS[u.perfil]||['',''];const pend=S.pedidos.filter(pp=>statusPedido(pp)!=='entregue').length,devendo=S.clientes.filter(c=>valoresConta(c.id).aReceber>0).length,totalDev=S.pedidos.filter(pp=>ehPrazo(pp)&&saldoPedido(pp)>0).reduce((a,pp)=>a+saldoPedido(pp),0),totalHoje=S.pedidos.filter(pp=>naData(pp,diaLocal(new Date()),diaLocal(new Date()))).reduce((a,pp)=>a+totalPedido(pp),0),totalGeral=S.pedidos.reduce((a,pp)=>a+totalPedido(pp),0),nPed=S.pedidos.length,nCli=S.clientes.length;const dias=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'],vals=[0,0,0,0,0,0,0];S.pedidos.forEach(pp=>{const d=new Date(pp.criadoEm),dw=(d.getDay()+6)%7;vals[dw]+=totalPedido(pp)});const max=Math.max(...vals,1),barras=dias.map((d,i)=>`<div class="bar" style="height:${Math.round(vals[i]/max*150)+10}px"><span>${d}</span></div>`).join('');const recentes=S.pedidos.slice().sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm)).slice(0,5);let recHtml=recentes.length?recentes.map(pp=>{const c=cliente(pp.clienteId);return `<div class="list-item"><span class="dot" style="background:${statusPedido(pp)==='entregue'?'#16a34a':statusPedido(pp)==='parcial'?'#d97706':'#dc2626'}"></span><span class="txt">${c?c.nome:'SEM CLIENTE'} • ${din(totalPedido(pp))}</span><span class="tm">${dt(pp.criadoEm).split(' ')[0]}</span></div>`}).join(''):`<div class="vazio">SEM ATIVIDADES AINDA</div>`;const atras=atrasados();let alHtml=atras.length?atras.slice(0,5).map(a=>`<div class="list-item"><span class="dot" style="background:#dc2626"></span><span class="txt">${a.c.nome} • ${a.dias} DIAS</span><span class="tm">${din(a.v)}</span></div>`).join(''):`<div class="list-item"><span class="dot" style="background:#16a34a"></span><span class="txt">NENHUM CLIENTE ATRASADO</span></div>`;let h=`<div class="card" style="display:flex;align-items:center;gap:10px;padding:12px 16px"><div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(90deg,var(--cor),var(--cor2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900">${(u.nome||'?').trim().charAt(0).toUpperCase()}</div><div style="flex:1"><div style="font-size:16px;font-weight:800">${u.nome}</div><div class="sub">${p[0]}${u.master?' • MASTER':''}</div></div></div><div class="kpis"><div class="kpi" onclick="trocarTab('pedidos')"><div class="kic" style="background:#fff7ed;color:#c2410c">📋</div><div class="knum">${nPed}</div><div class="krot">PEDIDOS</div><div class="kdelta" style="color:var(--cor)">${din(totalGeral)}</div></div><div class="kpi" onclick="trocarTab('clientes')"><div class="kic" style="background:#eff6ff;color:#1d4ed8">👥</div><div class="knum">${nCli}</div><div class="krot">CLIENTES</div><div class="kdelta" style="color:var(--azul)">CADASTRADOS</div></div><div class="kpi" onclick="trocarTab('financeiro')"><div class="kic" style="background:#fef3c7;color:#b45309">💰</div><div class="knum">${din(totalDev)}</div><div class="krot">A RECEBER</div><div class="kdelta" style="color:#b45309">${devendo} CLIENTE(S)</div></div><div class="kpi" onclick="trocarTab('pedidos')"><div class="kic" style="background:#dcfce7;color:#15803d">🛒</div><div class="knum">${din(totalHoje)}</div><div class="krot">VENDAS HOJE</div><div class="kdelta" style="color:#15803d">${pend} P/ ENTREGAR</div></div></div><div class="dash2"><div class="card"><h3 style="margin-bottom:6px">COMEÇE POR AQUI</h3><div class="acoes" style="margin-top:8px"><button class="btn btn-cor" onclick="novoPedido()">➕ NOVO PEDIDO</button><button class="btn btn-azul" onclick="trocarTab('clientes')">👥 NOVO CLIENTE</button><button class="btn btn-claro" onclick="trocarTab('produtos')">📦 PRODUTOS</button><button class="btn btn-claro" onclick="trocarTab('entregas')">🚚 ENTREGAS</button></div></div><div class="card"><h3 style="margin-bottom:6px">DESEMPENHO DA SEMANA</h3><div class="chart">${barras}</div><div class="sub" style="margin-top:26px;text-align:center">VENDAS POR DIA DA SEMANA</div></div></div><div class="dash2"><div class="card"><h3 style="margin-bottom:6px">ATIVIDADES RECENTES</h3>${recHtml}</div><div class="card"><h3 style="margin-bottom:6px">⚠️ ALERTAS IMPORTANTES</h3>${alHtml}</div></div>`;$('view-inicio').innerHTML=h}
function renderProdutos(){let h=`<div class="toolbar"><button class="btn btn-cor" style="flex:1" onclick="novoProduto()">➕ CADASTRAR PRODUTO</button></div>`;if(!S.produtos.length){h+=`<div class="vazio">NENHUM PRODUTO CADASTRADO. TOQUE EM + CADASTRAR PRODUTO.</div>`;$('view-produtos').innerHTML=h;return}S.produtos.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).forEach(p=>{let precos=`<span class="badge b-admin">${unLabel(p.un1)} • ${din(p.preco1)}</span>`;if(p.un2)precos+=` <span class="badge b-atendente">${unLabel(p.un2)} • ${din(p.preco2)}</span>`;if(p.un3)precos+=` <span class="badge b-entregue">${unLabel(p.un3)} • ${din(p.preco3)}</span>`;if(p.conv)precos+=` <span class="sub">${p.conv}</span>`;h+=`<div class="card"><div class="linha"><h3>${p.nome}</h3><span>${precos}</span></div><div class="linha" style="margin-top:6px"><span></span><span><button class="btn btn-claro" style="min-height:42px;padding:8px 10px;font-size:12px" onclick="editarProduto('${p.id}')">EDITAR</button>${podeExcluir()?`<button class="btn" style="min-height:42px;padding:8px 10px;font-size:12px;background:#fee2e2;color:#b91c1c" onclick="excluirProduto('${p.id}')">EXCLUIR</button>`:''}</span></div></div>`});$('view-produtos').innerHTML=h}

function addItemRow(qtd,desc,un,preco){const seq=seqItens++;const d=document.createElement('div');d.className='item-row';d.dataset.prod='';d.innerHTML=`<div class="item-r1"><input type="number" class="iq" value="${qtd||''}" placeholder="QTD" oninput="calcTotal()"><select class="iun" onchange="mudarUnidade(this)">${UNIDADES.map(u=>`<option value="${u}">${unLabel(u)}</option>`).join('')}</select><input type="text" id="idc_${seq}" class="idc" value="${desc||''}" placeholder="DESCRIÇÃO" oninput="buscarProdSug(${seq})"><button class="btn-mic" style="width:40px;height:40px;font-size:16px" onclick="vozCampo('idc_${seq}')">🎤</button><button class="btn-x" onclick="this.closest('.item-row').remove();calcTotal()">✕</button></div><div class="item-r2"><input type="number" class="ip" step="0.01" value="${preco||''}" placeholder="PREÇO" onfocus="campoPrecoAtivo=this" oninput="calcTotal()"><input type="text" class="itot" readonly value="R$ 0,00"></div><div class="prod-sug" id="prodSug_${seq}"></div>`;if(un)d.querySelector('.iun').value=un;$('pedItens').appendChild(d);calcTotal()}

function salvarPedido(){const cid=pedClienteId;if(!cid){toast('ESCOLHA O CLIENTE (OBRIGATÓRIO)');return}const itens=[];document.querySelectorAll('#pedItens .item-row').forEach(r=>{const qtd=+r.querySelector('.iq').value||0,desc=r.querySelector('.idc').value.trim(),un=r.querySelector('.iun')?r.querySelector('.iun').value:'un',preco=+r.querySelector('.ip').value||0;if(qtd>0&&desc)itens.push({qtd,descricao:desc,unidade:un,preco,entregue:0})});if(!itens.length){toast('ADICIONE AO MENOS UM ITEM');return}const obs=$('pedObs').value;if(pedEditId){const p=S.pedidos.find(x=>x.id===pedEditId);if((p.pagamentos||[]).length){const antigos=p.itens.map(i=>i.entregue||0);p.clienteId=cid;p.itens=itens.map((it,idx)=>({...it,entregue:antigos[idx]||0}));p.obs=obs;salvar();fechar('mPedido');renderAll();toast('PEDIDO SALVO ✅');return}}pedDados={cid,itens,obs};mostrarEscolhaPag();abrir('mPagarNovo')}

function textoPedido(p){const c=cliente(p.clienteId);let t='SOARES SOFTWARE\nPEDIDO\n';t+='CLIENTE: '+(c?c.nome:'')+'\n';if(c&&c.endereco)t+='ENDEREÇO: '+c.endereco+'\n';if(c&&c.bairro)t+='BAIRRO: '+c.bairro+'\n';if(c&&c.telefone)t+='TELEFONE: '+c.telefone+'\n';t+='----------------------------------\n';p.itens.forEach(i=>{t+=itemTxt(i)+'\n  UNIT: '+din(i.preco)+' • TOTAL: '+din(i.qtd*i.preco)+'\n'});t+='----------------------------------\n';t+='TOTAL: '+din(totalPedido(p))+'\n';if(p.obs)t+='OBS: '+p.obs+'\n';t+='DATA: '+dt(p.criadoEm);return t}
function imprimirPedido(id){const p=S.pedidos.find(x=>x.id===id);if(!p)return;const c=cliente(p.clienteId);let h=`<h2 style="text-align:center">SOARES SOFTWARE</h2><h3 style="text-align:center">PEDIDO</h3><p><b>CLIENTE:</b> ${c?c.nome:''}</p>${c&&c.endereco?`<p><b>ENDEREÇO:</b> ${c.endereco}</p>`:''}${c&&c.bairro?`<p><b>BAIRRO:</b> ${c.bairro}</p>`:''}${c&&c.telefone?`<p><b>TELEFONE:</b> ${c.telefone}</p>`:''}<table><thead><tr><th>QTD</th><th>UNIDADE</th><th>DESCRIÇÃO</th><th>VALOR UNIT.</th><th>VALOR TOTAL</th></tr></thead><tbody>`;p.itens.forEach(i=>{h+=`<tr><td>${i.qtd}</td><td>${i.unidade&&i.unidade!=='un'?unLabel(i.unidade):'UNIDADE'}</td><td>${i.descricao}</td><td>${din(i.preco)}</td><td>${din(i.qtd*i.preco)}</td></tr>`});h+=`</tbody></table><p><b>TOTAL: ${din(totalPedido(p))}</b></p>${p.obs?`<p><b>OBS:</b> ${p.obs}</p>`:''}<p>DATA: ${dt(p.criadoEm)}</p>`;$('printArea').innerHTML=h;window.print()}
function gerarPdfPedido(id){try{const p=S.pedidos.find(x=>x.id===id);if(!p)return null;const c=cliente(p.clienteId);const {jsPDF}=window.jspdf;const doc=new jsPDF();let y=15;doc.setFontSize(16);doc.setFont('helvetica','bold');doc.text('SOARES SOFTWARE',105,y,{align:'center'});y+=7;doc.setFontSize(13);doc.text('PEDIDO',105,y,{align:'center'});y+=9;doc.setFontSize(11);doc.setFont('helvetica','normal');doc.text('CLIENTE: '+(c?c.nome:''),15,y);y+=6;if(c&&c.endereco){doc.text('ENDEREÇO: '+c.endereco,15,y);y+=6}if(c&&c.bairro){doc.text('BAIRRO: '+c.bairro,15,y);y+=6}if(c&&c.telefone){doc.text('TELEFONE: '+c.telefone,15,y);y+=6}y+=2;doc.setFont('helvetica','bold');doc.text('QTD',15,y);doc.text('UNIDADE',35,y);doc.text('DESCRIÇÃO',75,y);doc.text('VALOR UNIT.',150,y,{align:'right'});doc.text('VALOR TOTAL',190,y,{align:'right'});doc.line(15,y+1,195,y+1);y+=6;doc.setFont('helvetica','normal');p.itens.forEach(i=>{const un=i.unidade&&i.unidade!=='un'?unLabel(i.unidade):'UNIDADE';doc.text(String(i.qtd),15,y);doc.text(un,35,y);doc.text(i.descricao,75,y);doc.text(din(i.preco),150,y,{align:'right'});doc.text(din(i.qtd*i.preco),190,y,{align:'right'});y+=7});y+=2;doc.setFont('helvetica','bold');doc.text('TOTAL: '+din(totalPedido(p)),190,y,{align:'right'});y+=8;doc.setFont('helvetica','normal');if(p.obs){doc.text('OBS: '+p.obs,15,y);y+=6}doc.text('DATA: '+dt(p.criadoEm),15,y);return doc}catch(e){return null}}
async function compartilharPedido(id){const p=S.pedidos.find(x=>x.id===id);if(!p)return;const pdf=gerarPdfPedido(id);if(pdf&&navigator.share&&navigator.canShare){const blob=pdf.output('blob');const file=new File([blob],'pedido-'+id+'.pdf',{type:'application/pdf'});if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'PEDIDO',text:'PEDIDO - SOARES SOFTWARE'});return}catch(e){if(e.name==='AbortError')return}}}const t=textoPedido(p);if(navigator.share){try{await navigator.share({title:'PEDIDO',text:t})}catch(e){}}else{window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}}
function verPedido(id){const p=S.pedidos.find(x=>x.id===id);if(!p)return;const c=cliente(p.clienteId);let h=`<div class="modal-head"><h2>PEDIDO DE ${c?c.nome:''}</h2><button class="btn-x" onclick="fechar('mDetalhe')">✕</button></div><div class="sub">${dt(p.criadoEm)}</div>`;if(c&&(c.telefone||c.endereco||c.bairro)){h+=`<div class="card" style="background:#fff7ed;border-color:#fed7aa;margin:10px 0;padding:10px"><div style="font-weight:800;color:var(--cor);margin-bottom:4px">📍 ONDE ENTREGAR</div>${c.endereco?`<div class="sub">🏠 ${c.endereco}</div>`:''}${c.bairro?`<div class="sub">🗺️ BAIRRO: ${c.bairro}</div>`:''}${c.telefone?`<div class="sub">📞 ${c.telefone}</div>`:''}</div>`}h+=`<div class="linha" style="margin:8px 0"><span class="badge ${ST[statusPedido(p)][1]}">${ST[statusPedido(p)][0]}</span></div><div class="estat"><div class="card"><div class="num">${din(totalPedido(p))}</div><div class="sub">TOTAL</div></div></div><label>ITENS</label>`;p.itens.forEach(i=>{h+=`<div class="item-ent"><span class="desc">${itemTxt(i)}</span><span class="sub">${din(i.qtd*i.preco)}</span></div>`});if(p.obs)h+=`<label>OBSERVAÇÕES</label><div class="sub">${p.obs}</div>`;h+=`<div class="acoes"><button class="btn btn-azul" onclick="imprimirPedido('${p.id}')">🖨️ IMPRIMIR</button><button class="btn btn-cor" onclick="compartilharPedido('${p.id}')">📲 COMPARTILHAR PDF</button><button class="btn btn-claro" onclick="editarPedido('${p.id}');fechar('mDetalhe')">EDITAR</button>${podeExcluir()?`<button class="btn" style="background:#fee2e2;color:#b91c1c" onclick="excluirPedido('${p.id}')">EXCLUIR</button>`:''}</div>`;$('mDetalheCorpo').innerHTML=h;abrir('mDetalhe')}
function excluirPedido(id){if(!podeExcluir()){toast('SÓ O ADMINISTRADOR PODE EXCLUIR');return}if(!confirm('EXCLUIR ESTE PEDIDO?'))return;S.pedidos=S.pedidos.filter(x=>x.id!==id);salvar();fechar('mDetalhe');renderAll();toast('PEDIDO EXCLUÍDO')}
function renderClientes(){const b=buscaCli.toLowerCase();let lista=S.clientes.filter(c=>!b||(c.nome+' '+c.telefone+' '+c.bairro).toLowerCase().includes(b));lista.sort((a,b)=>a.nome.localeCompare(b.nome));let h='';if(!lista.length)h+=`<div class="vazio">NENHUM CLIENTE ENCONTRADO. TOQUE EM + CLIENTE.</div>`;lista.forEach(c=>{const ini=(c.nome||'?').trim().charAt(0).toUpperCase();h+=`<div class="sug" onclick="verConta('${c.id}')"><div class="foto">${ini}</div><div class="info"><div class="n">${c.nome}</div><div class="d">${c.telefone||''} ${c.bairro?'• '+c.bairro:''} • ${S.pedidos.filter(p=>p.clienteId===c.id).length} PEDIDO(S)</div></div><div class="seta">›</div></div>`});$('res-clientes').innerHTML=h}
function novoCliente(){clienteEditId=null;$('mcTitulo').textContent='NOVO CLIENTE';['cNome','cTel','cBairro','cEnd','cObs'].forEach(i=>$(i).value='');abrir('mCliente')}
function editarCliente(id){const c=S.clientes.find(x=>x.id===id);if(!c)return;clienteEditId=id;$('mcTitulo').textContent='EDITAR CLIENTE';$('cNome').value=c.nome;$('cTel').value=c.telefone||'';$('cBairro').value=c.bairro||'';$('cEnd').value=c.endereco||'';$('cObs').value=c.obs||'';abrir('mCliente')}
function salvarCliente(){const nome=$('cNome').value.trim();if(!nome){toast('INFORME O NOME');return}const d={nome,telefone:$('cTel').value.trim(),bairro:$('cBairro').value.trim(),endereco:$('cEnd').value.trim(),obs:$('cObs').value.trim()};if(clienteEditId){const c=S.clientes.find(x=>x.id===clienteEditId);Object.assign(c,d)}else S.clientes.push({id:uid(),...d});salvar();fechar('mCliente');renderAll();if($('mPedido').classList.contains('aberta'))preencherCliente(clienteEditId||S.clientes[S.clientes.length-1].id);toast('CLIENTE SALVO ✅')}
function excluirCliente(id){if(!podeExcluir()){toast('SÓ O ADMINISTRADOR PODE EXCLUIR');return}if(!confirm('EXCLUIR CLIENTE E TODOS OS PEDIDOS DELE?'))return;S.pedidos=S.pedidos.filter(p=>p.clienteId!==id);S.clientes=S.clientes.filter(c=>c.id!==id);salvar();fechar('mConta');renderAll();toast('CLIENTE EXCLUÍDO')}
function renderContas(){const b=buscaConta.toLowerCase();let h='';if(!b){h=`<div class="vazio">🔍 DIGITE OU FALE O NOME DO CLIENTE.<br><br>CONFORME VOCÊ DIGITA, A CONTA APARECE AQUI.<br><span style="font-size:12px">(A CONTA MOSTRA SÓ PEDIDOS A PRAZO)</span></div>`;$('res-contas').innerHTML=h;return}let lista=S.clientes.filter(c=>c.nome.toLowerCase().includes(b));lista.sort((a,b)=>valoresConta(b.id).aReceber-valoresConta(a.id).aReceber);if(!lista.length){h=`<div class="vazio">NENHUM CLIENTE COM ESSE NOME.</div>`;$('res-contas').innerHTML=h;return}lista.forEach(c=>{const v=valoresConta(c.id),ini=(c.nome||'?').trim().charAt(0).toUpperCase();h+=`<div class="sug" onclick="verConta('${c.id}')"><div class="foto">${ini}</div><div class="info"><div class="n">${c.nome}</div><div class="d">QUANTO DEVE: ${din(v.aReceber)}</div></div><div class="seta">›</div></div>`});$('res-contas').innerHTML=h}
function verConta(id){const c=S.clientes.find(x=>x.id===id);if(!c)return;const pedPrazo=S.pedidos.filter(p=>p.clienteId===id&&ehPrazo(p)).sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm)),v=valoresConta(id);let h=`<div class="modal-head"><h2>${c.nome}</h2><button class="btn-x" onclick="fechar('mConta')">✕</button></div><div class="sub">${[c.telefone,c.bairro,c.endereco].filter(Boolean).join(' • ')}</div><div class="estat"><div class="card"><div class="num" style="color:${v.aReceber>0?'#b91c1c':'#15803d'}">${din(v.aReceber)}</div><div class="sub">QUANTO DEVE</div></div><div class="card"><div class="num" style="color:#15803d">${din(v.recebido)}</div><div class="sub">JÁ PAGOU</div></div></div><label>PEDIDOS A PRAZO (${pedPrazo.length})</label>`;if(!pedPrazo.length)h+=`<div class="vazio">NENHUM PEDIDO A PRAZO PARA ESTE CLIENTE.</div>`;pedPrazo.forEach(p=>{const pago=totalPagoPedido(p),saldo=saldoPedido(p),pgs=p.pagamentos||[];h+=`<div class="card"><div class="linha"><span class="badge ${ST[statusPedido(p)][1]}">${ST[statusPedido(p)][0]}</span>${saldo>0?'<span class="badge b-pagpend">A PAGAR</span>':'<span class="badge b-entregue">PAGO</span>'}</div><span class="sub">${dt(p.criadoEm)}</span><div class="linha" style="margin-top:6px"><span>${p.itens.map(itemTxt).join(', ')}</span></div><div class="linha" style="margin-top:6px"><span class="total" style="margin:0">${din(totalPedido(p))}</span></div><div class="linha" style="margin-top:4px"><span class="sub">JÁ PAGO: ${din(pago)} • FALTA: <b style="color:${saldo>0?'#b91c1c':'#15803d'}">${din(saldo)}</b></span></div>${pgs.length?`<div class="sub">${pgs.map(pg=>formaLabel(pg.forma)+' '+din(pg.valor)+' ('+dt(pg.data).split(' ')[0]+')').join(' • ')}</div>`:''}<div class="linha" style="margin-top:8px"><span>${saldo>0?`<button class="btn btn-cor" style="min-height:42px;padding:8px 10px;font-size:12px" onclick="abrirPagamento('${p.id}')">💵 RECEBER</button>`:''}</span><button class="btn btn-claro" style="min-height:42px;padding:8px 10px;font-size:12px" onclick="verPedido('${p.id}')">VER</button></div></div>`});h+=`<div class="acoes"><button class="btn btn-azul" onclick="fechar('mConta');histCli='${c.nome}';trocarTab('historico')">📜 HISTÓRICO</button>${podeExcluir()?`<button class="btn" style="background:#fee2e2;color:#b91c1c" onclick="excluirCliente('${c.id}')">EXCLUIR</button>`:''}</div>`;$('mContaCorpo').innerHTML=h;abrir('mConta')}
function renderFinanceiro(){if(!usuarioLogado)return;const totalAR=S.pedidos.filter(ehPrazo).reduce((a,p)=>a+saldoPedido(p),0);const comDebito=S.clientes.map(c=>({c,v:valoresConta(c.id).aReceber})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);const atras=atrasados();let h=`<div class="estat"><div class="card"><div class="num">${din(totalAR)}</div><div class="sub">TOTAL A RECEBER</div></div><div class="card"><div class="num">${comDebito.length}</div><div class="sub">CLIENTES DEVENDO</div></div><div class="card"><div class="num">${atras.length}</div><div class="sub">ATRASADOS</div></div></div><h3 style="margin:10px 0 6px">💰 CONTAS A RECEBER</h3>`;if(!comDebito.length)h+=`<div class="vazio">NENHUM VALOR A RECEBER.</div>`;comDebito.forEach(x=>{const ini=(x.c.nome||'?').trim().charAt(0).toUpperCase();h+=`<div class="sug" onclick="verConta('${x.c.id}')"><div class="foto">${ini}</div><div class="info"><div class="n">${x.c.nome}</div><div class="d">A RECEBER: ${din(x.v)}</div></div><div class="seta">›</div></div>`});h+=`<h3 style="margin:14px 0 6px">⏰ CLIENTES ATRASADOS (30+ DIAS)</h3>`;if(!atras.length)h+=`<div class="vazio">NENHUM CLIENTE ATRASADO. 🎉</div>`;atras.forEach(a=>{const ini=(a.c.nome||'?').trim().charAt(0).toUpperCase();h+=`<div class="sug" onclick="verConta('${a.c.id}')"><div class="foto" style="background:#dc2626">${ini}</div><div class="info"><div class="n">${a.c.nome}</div><div class="d">⚠️ ${a.dias} DIA(S) SEM PAGAR • DEVE ${din(a.v)}</div></div><div class="seta">›</div></div>`});$('view-financeiro').innerHTML=h}
function renderEntregas(){let h=`<div class="toolbar"><label style="margin:0">SEU NOME (ENTREGADOR)</label><div class="campo-voz" style="flex:1"><input type="text" id="entNome" placeholder="DIGITE SEU NOME..." value="${entregador}" oninput="entregador=this.value;localStorage.setItem('entregador',entregador)"><button class="btn-mic" onclick="vozCampo('entNome')">🎤</button></div></div>`;h+=`<div class="chips">${['pendente','parcial','entregue'].map(s=>`<button class="${filtroEnt===s?'ativo':''}" onclick="filtroEnt='${s}';renderEntregas()">${s.toUpperCase()} (${S.pedidos.filter(p=>statusPedido(p)===s).length})</button>`).join('')}</div>`;let lista=S.pedidos.filter(p=>statusPedido(p)===filtroEnt).sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm));if(!lista.length)h+=`<div class="vazio">NENHUM PEDIDO ${filtroEnt==='pendente'?'COM ENTREGA PENDENTE':filtroEnt==='parcial'?'COM ENTREGA PARCIAL':'ENTREGUE'}.</div>`;lista.forEach(p=>{const c=cliente(p.clienteId);h+=`<div class="card"><div class="linha"><h3>${c?c.nome:'SEM CLIENTE'}</h3><span class="badge ${ST[statusPedido(p)][1]}">${ST[statusPedido(p)][0]}</span></div>${c&&c.endereco?`<div class="sub">📍 ${c.endereco}</div>`:''}${c&&c.bairro?`<div class="sub">🗺️ ${c.bairro}</div>`:''}<div class="sub" style="margin-top:4px">${p.itens.map(itemTxt).join(' • ')}</div><div class="linha" style="margin-top:8px"><span class="total" style="margin:0">${din(totalPedido(p))}</span><span><button class="btn btn-azul" style="min-height:42px;padding:8px 10px;font-size:12px" onclick="verPedido('${p.id}')">VER PEDIDO</button><button class="btn btn-cor" style="min-height:42px;padding:8px 10px;font-size:12px" onclick="abrirEntrega('${p.id}')">MARCAR ENTREGA</button></span></div><div class="acoes"><button class="btn btn-claro" onclick="imprimirPedido('${p.id}')">🖨️ IMPRIMIR</button><button class="btn btn-cor" onclick="compartilharPedido('${p.id}')">📲 COMPARTILHAR PDF</button></div></div>`});$('view-entregas').innerHTML=h}
function abrirEntrega(id){const p=S.pedidos.find(x=>x.id===id);if(!p)return;entregaPedId=id;const c=cliente(p.clienteId);let h=`<div class="modal-head"><h2>MARCAR ENTREGA</h2><button class="btn-x" onclick="fechar('mEntrega')">✕</button></div><div class="sub">${c?c.nome:''} ${c&&c.bairro?'• '+c.bairro:''}</div><label>QUANTO FOI ENTREGUE DE CADA ITEM?</label>`;p.itens.forEach((it,idx)=>{h+=`<div class="item-ent"><span class="desc">${itemTxt(it)}</span><input type="number" id="entQ${idx}" min="0" max="${it.qtd}" value="${it.entregue||0}"> <span class="sub">/ ${it.qtd}</span></div>`});h+=`<div class="acoes"><button class="btn btn-verde" onclick="baixarTudo()">✅ ENTREGAR TUDO</button><button class="btn btn-cor" onclick="salvarBaixa()">💾 SALVAR</button><button class="btn btn-claro" onclick="zerarBaixa()">↩️ ZERAR</button></div>`;$('mEntregaCorpo').innerHTML=h;abrir('mEntrega')}
function salvarBaixa(){const p=S.pedidos.find(x=>x.id===entregaPedId);if(!p)return;p.itens.forEach((it,idx)=>{const v=+$('entQ'+idx).value||0;it.entregue=Math.max(0,Math.min(it.qtd,v))});p.entregueEm=new Date().toISOString();p.entreguePor=entregador||(usuarioLogado?usuarioLogado.nome:'');salvar();fechar('mEntrega');renderAll();toast('ENTREGA REGISTRADA ✅')}
function baixarTudo(){const p=S.pedidos.find(x=>x.id===entregaPedId);if(!p)return;p.itens.forEach(it=>it.entregue=it.qtd);p.entregueEm=new Date().toISOString();p.entreguePor=entregador||(usuarioLogado?usuarioLogado.nome:'');salvar();fechar('mEntrega');renderAll();toast('ENTREGUE ✅')}
function zerarBaixa(){const p=S.pedidos.find(x=>x.id===entregaPedId);if(!p)return;p.itens.forEach(it=>it.entregue=0);p.entregueEm='';p.entreguePor='';salvar();fechar('mEntrega');renderAll();toast('VOLTOU PARA PENDENTE')}
function renderHistorico(){const b=histCli.toLowerCase();let lista=S.pedidos.filter(p=>naData(p,histDataDe,histDataAte));if(b)lista=lista.filter(p=>(cliente(p.clienteId)?.nome||'').toLowerCase().includes(b));lista.sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm));const total=lista.reduce((a,p)=>a+totalPedido(p),0);let h=`<div class="sub" style="margin-bottom:8px">${lista.length} PEDIDO(S) • TOTAL ${din(total)}</div>`;if(!lista.length)h+=`<div class="vazio">NENHUM PEDIDO ENCONTRADO. USE A BUSCA DE CLIENTE E OS FILTROS DE DATA.</div>`;lista.forEach(p=>{const c=cliente(p.clienteId);h+=`<div class="card"><div class="linha"><h3>${c?c.nome:'CLIENTE REMOVIDO'}</h3><span class="badge ${ST[statusPedido(p)][1]}">${ST[statusPedido(p)][0]}</span></div><div class="sub">${dt(p.criadoEm)}</div><div class="sub" style="margin-top:4px">${p.itens.map(itemTxt).join(', ')}</div><div class="linha" style="margin-top:8px"><span class="total" style="margin:0">${din(totalPedido(p))}</span><button class="btn btn-claro" style="min-height:40px;padding:8px 10px;font-size:12px" onclick="verPedido('${p.id}')">VER</button></div></div>`});$('res-historico').innerHTML=h}
function renderConfig(){if(perfilAtivo()!=='admin'){mostrarAba('inicio');return}let h=`<div class="aviso">💡 O SISTEMA SALVA AUTOMATICAMENTE NO BANCO NA NUVEM. OS DADOS APARECEM PARA TODA A EQUIPE EM TODOS OS APARELHOS.</div><div class="card"><h3>BANCO GOOGLE SHEETS (OPCIONAL)</h3><label>URL DO APLICATIVO WEB (APPS SCRIPT)</label><input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/..." value="${gsUrl}"><div class="acoes"><button class="btn btn-cor" onclick="salvarUrl()">SALVAR BANCO</button><button class="btn btn-claro" onclick="syncPull()">SINCRONIZAR</button><button class="btn btn-claro" onclick="$('cfgUrl').value='';salvarUrl()">REMOVER</button></div></div><div class="card"><h3>BACKUP</h3><div class="acoes"><button class="btn btn-cor" onclick="exportar()">⬇️ EXPORTAR BACKUP</button><label class="btn btn-claro" style="text-align:center;cursor:pointer">⬆️ IMPORTAR BACKUP<input type="file" accept=".json" style="display:none" onchange="importar(this)"></label></div><div class="sub" style="margin-top:8px">${S.usuarios.length} USUÁRIO(S) • ${S.clientes.length} CLIENTE(S) • ${S.pedidos.length} PEDIDO(S) • ${S.produtos.length} PRODUTO(S)</div></div><div class="card"><h3>ZONA DE PERIGO</h3><button class="btn" style="background:#fee2e2;color:#b91c1c" onclick="apagarTudo()">🗑️ APAGAR TODOS OS DADOS</button></div>`;$('view-config').innerHTML=h}
function salvarUrl(){gsUrl=$('cfgUrl').value.trim();localStorage.setItem('gs_url',gsUrl);renderConfig();if(gsUrl)syncPull();else toast('BANCO REMOVIDO')}
function exportar(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-entregas-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('BACKUP EXPORTADO')}
function importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d&&Array.isArray(d.clientes)){S={clientes:d.clientes,pedidos:d.pedidos||[],usuarios:d.usuarios||[],produtos:d.produtos||[]};salvar();if(usuarioLogado){renderNav();renderAll()}toast('BACKUP IMPORTADO ✅')}else toast('ARQUIVO INVÁLIDO')}catch(err){toast('ARQUIVO INVÁLIDO')}};r.readAsText(f);inp.value=''}
function apagarTudo(){if(!podeExcluir()){toast('SÓ O ADMINISTRADOR PODE APAGAR');return}if(!confirm('APAGAR TODOS OS DADOS DESTE APARELHO?'))return;if(!confirm('TEM CERTEZA? ISSO NÃO PODE SER DESFEITO.'))return;S={clientes:[],pedidos:[],usuarios:[],produtos:[]};saveLocal();salvar();renderNav();renderAll();toast('DADOS APAGADOS')}
